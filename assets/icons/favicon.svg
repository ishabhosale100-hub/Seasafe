<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#060d17" />
  <circle cx="32" cy="32" r="24" fill="none" stroke="#0f2b48" stroke-width="2" />
  <circle cx="32" cy="32" r="28" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3, 3" opacity="0.6" />
  <!-- Compass Needle / Beacon Wave -->
  <path d="M32 10 L37 28 L32 25 L27 28 Z" fill="url(#grad)" filter="url(#glow)" />
  <path d="M32 54 L37 36 L32 39 L27 36 Z" fill="#334155" />
  <!-- Waves -->
  <path d="M16 42 Q 24 37 32 42 T 48 42" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M20 48 Q 28 44 32 48 T 44 48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <circle cx="32" cy="32" r="3.5" fill="#00f0ff" />
</svg>
